<style>
:root {
  --bg: #0a0a0b;
  --bg-card: #111113;
  --text-1: #ffffff;
  --text-2: rgba(255,255,255,0.6);
  --text-3: rgba(255,255,255,0.4);
  --text-4: rgba(255,255,255,0.25);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.14);
  --good: #6ee7b7;
  --warn: #fbbf24;
  --bad: #ff8a8a;
  --info: #7DD3FC;
  --font: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, SF Mono, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 0%, #14141a 0%, #0a0a0b 60%);
  color: var(--text-1);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
.shell { max-width: 720px; margin: 0 auto; padding: 24px 16px 80px; }

/* ----- Top day pill + header ----- */
.day-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 11px; font-weight: 700; letter-spacing: 0.10em;
  text-transform: uppercase;
  -webkit-tap-highlight-color: transparent;
}
.day-pill .day-sep { color: var(--text-4); }

.header {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  margin-bottom: 18px;
}
.header-left { display: flex; align-items: center; gap: 10px; justify-self: start; }
.header > .icon-btn:last-child { justify-self: end; }
.title { font-size: 22px; font-weight: 700; letter-spacing: -0.015em; margin: 0; justify-self: center; text-align: center; }
.icon-btn {
  width: 38px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-2); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.18s, color 0.18s;
}
.icon-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-1); }

/* ----- Eyebrow divider ----- */
.divider {
  display: flex; align-items: center; gap: 16px; margin-bottom: 14px;
}
.divider::before, .divider::after {
  content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.10);
}
.divider span {
  font-size: 11px; letter-spacing: 0.22em; font-weight: 600;
  color: rgba(255,255,255,0.85);
}

/* ----- Card ----- */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px 20px 18px;
  margin-bottom: 14px;
}

/* ----- Habit hero (count today) ----- */
.habit-label {
  font-size: 10px; letter-spacing: 0.20em; font-weight: 700;
  color: var(--text-3); margin-bottom: 8px; text-transform: uppercase;
}
.habit-row-count {
  display: flex; align-items: baseline; gap: 8px; margin-bottom: 18px;
}
.habit-num {
  font-size: 56px; font-weight: 700; letter-spacing: -0.03em;
  line-height: 1; font-variant-numeric: tabular-nums;
}
.habit-target {
  font-size: 18px; color: var(--text-3); font-weight: 500;
}

/* ----- Weekly habit grid (habit rows × 7 day columns) ----- */
.week-grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
.week-grid {
  display: grid;
  grid-template-columns: minmax(120px, 1.4fr) repeat(7, minmax(40px, 1fr));
  gap: 0 4px;
  min-width: 560px;
}
.week-grid-day-head {
  font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-3); text-align: center; padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.week-grid-day-head.today { color: var(--good); }
.week-grid-name {
  font-size: 13px; font-weight: 600; color: var(--text-1);
  padding: 10px 8px 10px 0;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
}
.week-grid-cell {
  display: flex; align-items: center; justify-content: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.week-check {
  width: 22px; height: 22px; flex-shrink: 0;
  border-radius: 7px; border: 1.5px solid var(--border-strong);
  background: rgba(255,255,255,0.04);
  display: flex; align-items: center; justify-content: center;
  color: #04140d; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, border-color 0.15s;
}
.week-check svg { width: 11px; height: 11px; opacity: 0; transform: scale(0.6); transition: opacity 0.12s, transform 0.12s; }
.week-check.checked { background: var(--good); border-color: var(--good); }
.week-check.checked svg { opacity: 1; transform: scale(1); }
.week-grid-foot-label {
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase;
  color: var(--text-3); padding-top: 10px;
}
.week-grid-foot-val {
  font-size: 11px; font-weight: 700; font-family: var(--font-mono);
  color: var(--good); text-align: center; padding-top: 10px;
}

/* ----- Continuous weekly progress bar ----- */
.week-progress-wrap { margin-top: 20px; }
.week-progress-track {
  position: relative; height: 34px; border-radius: 10px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  overflow: hidden;
}
.week-progress-fill {
  position: absolute; top: 0; bottom: 0; left: 0;
  background: linear-gradient(90deg, var(--info), var(--good));
  transition: width 0.4s ease;
}
.week-progress-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
.week-progress-label span {
  font-family: var(--font-mono); font-size: 13px; font-weight: 800;
  color: #fff;
  background: rgba(0,0,0,0.35);
  padding: 3px 10px; border-radius: 999px;
}

/* ----- History ----- */
.hist-row {
  display: grid; grid-template-columns: 70px 1fr auto; gap: 10px;
  padding: 10px 0; align-items: center;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}
.hist-row:last-child { border-bottom: none; }
.hist-date { font-size: 11px; color: var(--text-3); font-family: var(--font-mono); }
.hist-bar-wrap {
  height: 8px; background: rgba(255,255,255,0.04); border-radius: 4px; overflow: hidden;
}
.hist-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--info), var(--good));
  border-radius: 4px;
}
.hist-bar-fill.miss { background: rgba(255,138,138,0.4); }
.hist-count {
  font-family: var(--font-mono); font-size: 12px;
  color: var(--text-2); font-variant-numeric: tabular-nums;
}

/* ----- Mini chart for last 14 days ----- */
.spark-wrap { padding: 6px 0; }
.spark-svg { width: 100%; height: 70px; display: block; }
.spark-bar { fill: var(--good); }
.spark-bar.miss { fill: rgba(255,138,138,0.5); }
.spark-target {
  stroke: rgba(255,255,255,0.20);
  stroke-width: 1; stroke-dasharray: 3 3;
  vector-effect: non-scaling-stroke;
}

/* ----- Modal ----- */
.modal-bg {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
  z-index: 100; align-items: center; justify-content: center; padding: 20px;
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 480px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  padding: 22px; max-height: 88vh; overflow-y: auto;
}
.modal h3 {
  margin: 0 0 14px; font-size: 17px; font-weight: 700;
}
.set-section { margin-bottom: 22px; }
.set-section h4 {
  margin: 0 0 8px; font-size: 11px; font-weight: 800; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--text-3);
}

/* ----- Buttons ----- */
.btn-primary {
  width: 100%; padding: 13px;
  border: none;
  background: linear-gradient(180deg, #ffffff 0%, #e8e5dd 100%);
  color: #0a0a0b; border-radius: 12px;
  font-family: inherit; font-size: 14px; font-weight: 700;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55), 0 4px 14px rgba(0,0,0,0.40);
  -webkit-tap-highlight-color: transparent;
}
.btn-secondary {
  padding: 11px 16px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text-1); border-radius: 10px;
  font-family: inherit; font-size: 13px; font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn-secondary:hover { background: rgba(255,255,255,0.10); }
.modal-actions {
  display: flex; gap: 8px; margin-top: 16px;
}
.modal-actions .btn-primary { flex: 1; }

@media (max-width: 480px) {
  .shell { padding: 16px 12px 60px; }
  .habit-num { font-size: 48px; }
  .week-check { width: 20px; height: 20px; }
  .week-grid-day-head { font-size: 9px; }
  .week-grid-name { font-size: 12px; }
  .week-grid-foot-val { font-size: 10px; }
}
</style>
</head>

  <div class="header">
    <div class="header-left">

        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>

  <div class="card">

</div>

<!-- Settings modal -->
<div class="modal-bg" id="setModalBg">
  <div class="modal">
    <h3>Settings</h3>

    <div class="set-section">
      <h4>Data</h4>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-secondary" id="setExport">Export JSON</button>
        <button class="btn-secondary" id="setImport">Import JSON</button>
        <button class="btn-secondary" id="setReset" style="color:var(--bad);border-color:rgba(255,138,138,0.3)">Reset all</button>

      <input type="file" id="setImportFile" accept=".json" style="display:none">
    </div>

    <div class="modal-actions">
      <button class="btn-primary" id="setClose">Done</button>
    </div>

<script>
(function() {
  const $ = (id) => document.getElementById(id);

  // ============================================================
  // HABITS — fixed daily checklist. Edit names here to change them.
  // ============================================================
  const HABITS = [
    { id: 'gym',           name: 'Gym/Cardio' },
    { id: 'phone_morning', name: '<5 Minutes Phone in Morning' },
    { id: 'eating_9010',   name: '90/10 Eating' },
    { id: 'skincare',      name: 'Skincare' },
    { id: 'np',            name: 'NP' },
    { id: 'homework',      name: '0.5 Hour Homework' },
    { id: 'work',          name: '2 Hour Work' },
    { id: 'water_3l',      name: '3 Liters Water' },
    { id: 'journal',       name: 'Journal' },
    { id: 'social_media',  name: 'Less than 1 Hour Social Media' }
  ];

  // ============================================================
  // STATE — {logs: {'YYYY-MM-DD': {habitId: true, ...}}}
  // ============================================================
  const LS_KEY = 'po_habits_v1';
  function loadState() {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) return normalize(JSON.parse(raw));
    } catch (e) {}
    return normalize({});
  }
  function normalize(s) {
    s = s || {};
    s.logs = (s.logs && typeof s.logs === 'object') ? s.logs : {};
    return s;
  }
  function saveState() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {}
  }
  let state = loadState();
  $('appTitle').textContent = CONFIG.appTitle || 'Habit Tracker';

  // Helpers
  function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function todayKey() { return dateKey(new Date()); }
  function dayLog(key) { return state.logs[key] || {}; }
  function dayCount(key) { return Object.values(dayLog(key)).filter(Boolean).length; }
  function toggleHabitOnDay(dayKey, habitId) {
    const log = Object.assign({}, dayLog(dayKey));
    log[habitId] = !log[habitId];
    if (Object.values(log).some(Boolean)) state.logs[dayKey] = log;
    else delete state.logs[dayKey];
    saveState();
  }

  // Monday-start week containing today.
  function weekDates() {
    const now = new Date();
    const dow = now.getDay(); // 0=Sun..6=Sat
    const diffToMonday = (dow === 0 ? -6 : 1) - dow;
    const monday = new Date(now);
    monday.setDate(now.getDate() + diffToMonday);
    monday.setHours(0, 0, 0, 0);
    const dates = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      dates.push(d);
    }
    return dates;
  }

  // ============================================================
  // RENDER
  // ============================================================
  function renderDayPill() {
    const d = new Date();
    const dows = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
    const mons = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    $('dayPillLabel').textContent = dows[d.getDay()] + ', ' + mons[d.getMonth()] + ' ' + d.getDate();
  }

  function renderHabits() {
    const dates = weekDates();
    const today = todayKey();
    const dow = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
    const weekTarget = HABITS.length * dates.length;

    let weekTotal = 0;
    dates.forEach(d => { weekTotal += dayCount(dateKey(d)); });
    const weekPct = Math.round((weekTotal / weekTarget) * 100);

    $('habitNum').textContent = weekTotal;
    $('habitTarget').textContent = '/ ' + weekTarget;

    // Header row: blank corner + 7 day labels.
    let html = '<div></div>';
    dates.forEach((d, i) => {
      const isToday = dateKey(d) === today;
      html += '<div class="week-grid-day-head' + (isToday ? ' today' : '') + '">' + dow[i] + '</div>';
    });

    // One row per habit, one checkbox cell per day.
    HABITS.forEach(h => {
      html += '<div class="week-grid-name">' + escape(h.name) + '</div>';
      dates.forEach(d => {
        const k = dateKey(d);
        const checked = !!dayLog(k)[h.id];
        html += '<div class="week-grid-cell">'
          + '<button class="week-check' + (checked ? ' checked' : '') + '" data-day="' + k + '" data-habit="' + h.id + '" type="button" aria-label="Toggle ' + escape(h.name) + ' for ' + k + '" aria-pressed="' + checked + '">'
          +   '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>'
          + '</button>'
          + '</div>';
      });
    });

    // Footer row: per-day completion %.
    html += '<div class="week-grid-foot-label">DAILY</div>';
    dates.forEach(d => {
      const pct = Math.round((dayCount(dateKey(d)) / HABITS.length) * 100);
      html += '<div class="week-grid-foot-val">' + pct + '%</div>';
    });

    const grid = $('weekGrid');
    grid.innerHTML = html;
    grid.querySelectorAll('.week-check').forEach(btn => {
      btn.addEventListener('click', () => {
        toggleHabitOnDay(btn.dataset.day, btn.dataset.habit);
        renderHabits();
        renderHistory();
        renderSparkline();
      });
    });

    // One continuous bar for the whole week (0-100%, ~1.43% per habit checked).
    $('weekProgressFill').style.width = weekPct + '%';
    $('weekProgressPct').textContent = weekPct + '%';
  }

  function renderHistory() {
    const list = $('histList');
    const target = HABITS.length;
    const days = [];
    for (let i = 6; i >= 1; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const k = dateKey(d);
      days.push({ date: d, count: dayCount(k) });
    }
    list.innerHTML = days.map(({date, count}) => {
      const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const lbl = dows[date.getDay()] + ' ' + (date.getMonth()+1) + '/' + date.getDate();
      const pct = Math.min(100, (count / target) * 100);
      const cls = (count >= target) ? '' : 'miss';
      return '<div class="hist-row">'
        + '<span class="hist-date">' + lbl + '</span>'
        + '<div class="hist-bar-wrap"><div class="hist-bar-fill ' + cls + '" style="width:' + pct + '%"></div></div>'
        + '<span class="hist-count">' + count + '/' + target + '</span>'
        + '</div>';
    }).join('') || '<div style="text-align:center;font-size:12px;color:var(--text-3);padding:12px 0">No logs yet.</div>';
  }

  function renderSparkline() {
    const svg = $('sparkSvg');
    const W = 280, H = 70, pad = 4;
    const days = 14;
    const target = HABITS.length;
    const data = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      data.push(dayCount(dateKey(d)));
    }
    const maxVal = Math.max(target, Math.max.apply(null, data)) || 1;
    const colW = (W - pad * 2) / data.length;
    const barW = colW * 0.7;
    let html = '';
    const targetY = H - pad - (target / maxVal) * (H - pad * 2);
    html += '<line class="spark-target" x1="0" x2="' + W + '" y1="' + targetY.toFixed(1) + '" y2="' + targetY.toFixed(1) + '"/>';
    data.forEach((v, i) => {
      const x = pad + i * colW + (colW - barW) / 2;
      const h = (v / maxVal) * (H - pad * 2);
      const y = H - pad - h;
      const cls = (v >= target) ? 'spark-bar' : 'spark-bar miss';
      html += '<rect class="' + cls + '" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, h).toFixed(1) + '" rx="2"/>';
    });
    svg.innerHTML = html;
  }

  function renderAll() { renderDayPill(); renderHabits(); renderHistory(); renderSparkline(); }

  // ============================================================
  // SETTINGS (data export/import/reset only)
  // ============================================================
  $('settingsBtn').addEventListener('click', () => { $('setModalBg').classList.add('show'); });
  $('setClose').addEventListener('click', () => $('setModalBg').classList.remove('show'));

  $('setExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'habit-tracker-data-' + new Date().toISOString().slice(0,10) + '.json';
    a.click(); URL.revokeObjectURL(url);
  });
  $('setImport').addEventListener('click', () => $('setImportFile').click());
  $('setImportFile').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const parsed = JSON.parse(r.result);
        if (!confirm('Replace ALL current data with the imported file?')) return;
        state = normalize(parsed);
        saveState(); renderAll();
      } catch (err) { alert('Import failed: ' + err.message); }
    };
    r.readAsText(f);
  });
  $('setReset').addEventListener('click', () => {
    if (!confirm('Wipe ALL habit logs? This cannot be undone.')) return;
    localStorage.removeItem(LS_KEY);
    state = loadState();
    $('setModalBg').classList.remove('show');
    renderAll();
  });

  function escape(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // BOOT
  renderAll();
})();
</script>
<style>
/* === iPhone bottom-safe-area fix ===
   The Done button in the settings modal + the bottom of the page were
   getting blocked by the iPhone home indicator. These rules add
   safe-area padding so nothing sits under it. */
.shell {
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}
.modal-bg {
  padding-bottom: max(20px, env(safe-area-inset-bottom));
  padding-top: max(20px, env(safe-area-inset-top));
}
.modal {
  max-height: calc(88vh - env(safe-area-inset-bottom));
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // When embedded in health.html, the parent owns sync for the 'health'
  // row — running our own sync here would race and wipe sibling keys.
  try { if (window.self !== window.top) return; } catch (e) { return; }
  if (typeof initCloudSync !== 'function') return;
  initCloudSync({
    appKey: 'health',
    syncedKeys: ['po_habits_v1'],
    onApplied: function () {
      window.dispatchEvent(new Event('storage'));
    }
  });
});
</script>
